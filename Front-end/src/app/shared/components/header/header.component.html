<!-- Main Header -->
<header class="main-header sticky top-0 z-50 bg-white/85 backdrop-blur-xl border-b border-slate-100 py-4 px-4 sm:px-6 lg:px-12">
  <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4 lg:flex-nowrap lg:gap-8">

    <!-- Logo -->
    <a [routerLink]="['/']" class="flex items-center gap-3">
      <img src="assets/lightstorm logo.png" alt="Lightstorm Logo" class="app-logo h-[44px] md:h-[54px]">
    </a>


    <!-- Search Bar (Desktop) - Global Search Component -->
    <div class="hidden md:flex flex-1 min-w-[220px] max-w-xl lg:max-w-2xl md:order-3 lg:order-none">
      <app-global-search></app-global-search>
    </div>
    <!-- Actions -->
    <div class="flex items-center gap-2 md:gap-3 lg:gap-6">
      <div class="hidden lg:flex items-center gap-3 border-r border-slate-100 pr-4 xl:pr-6 mr-2 xl:mr-4">
        <div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-[#EF4444]">
          <i class="bi bi-telephone-fill"></i>
        </div>
        <div class="text-left text-xs">
          <p class="text-slate-400 font-bold uppercase tracking-widest">Support</p>
          <p class="font-black text-[#1E293B]">+254 700 250 499</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <a [routerLink]="['/cart']" class="relative group p-2 rounded-xl hover:bg-slate-50 transition-colors">
          <i class="bi bi-cart text-2xl text-slate-600 group-hover:text-[#EF4444]"></i>
          <span *ngIf="data > 0"
            class="absolute -top-1 -right-1 bg-[#EF4444] text-white text-[10px] font-black px-1.5 py-0.5 rounded-full border-2 border-white">
            {{data}}
          </span>
        </a>
        <a [routerLink]="['/profile']" class="p-2 rounded-xl hover:bg-slate-50 transition-colors">
          <i class="bi bi-person text-2xl text-slate-600"></i>
        </a>
        <button class="md:hidden p-2 rounded-xl" [matMenuTriggerFor]="mobileMenu">
          <i class="bi bi-list text-2xl"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Search Bar - Global Search Component -->
  <div class="md:hidden mt-4">
    <app-global-search></app-global-search>
  </div>
</header>

<!-- Desktop Navigation -->
<nav class="hidden md:block bg-white border-b border-slate-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-12 py-3 flex flex-wrap items-center gap-4 lg:gap-10">
    <div class="flex flex-wrap items-center gap-6 lg:gap-8">
      <a [routerLink]="['/home']" routerLinkActive="text-[#EF4444] border-b-2 border-[#EF4444]"
        class="text-xs font-black uppercase tracking-widest text-slate-600 hover:text-[#1E293B] pb-3 transition-colors">Shop</a>
      <a [routerLink]="['/products']"
        class="text-xs font-black uppercase tracking-widest text-slate-600 hover:text-[#1E293B] pb-3 transition-colors">Solutions</a>
      <a href="#"
        class="text-xs font-black uppercase tracking-widest text-slate-600 hover:text-[#1E293B] pb-3 transition-colors">Insights</a>
      <a [routerLink]="['/about']"
        class="text-xs font-black uppercase tracking-widest text-slate-600 hover:text-[#1E293B] pb-3 transition-colors">About
        Us</a>
    </div>

      <div class="nav-support ml-0 md:ml-auto flex items-center gap-2 rounded-full bg-slate-50 px-4 py-2">
      <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Free Consultation:</span>
      <a href="https://wa.me/254700250499"
        class="text-xs font-black text-[#84CC16] hover:underline underline-offset-4 flex items-center gap-1">
        <i class="bi bi-whatsapp"></i> WhatsApp Direct
      </a>
    </div>
  </div>
</nav>

<!-- Mobile Menu -->
<mat-menu #mobileMenu="matMenu" class="modern-menu">
  <div class="p-4 bg-slate-50 mb-2">
    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Navigation</p>
    <a mat-menu-item [routerLink]="['/home']" class="rounded-xl">Home</a>
    <a mat-menu-item [routerLink]="['/products']" class="rounded-xl">All Products</a>
    <a mat-menu-item [routerLink]="['/about']" class="rounded-xl">About Us</a>
  </div>
  <div class="px-4 py-2">
    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Categories</p>
    <a mat-menu-item *ngFor="let cat of categories" [routerLink]="['/products']" [queryParams]="{ category: cat.slug }">
      <span>{{cat.name}}</span>
    </a>
  </div>
</mat-menu>
