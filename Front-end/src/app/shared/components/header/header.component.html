<!-- Top Bar -->
<div class="top-bar py-2 d-none d-lg-block">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="top-left d-flex gap-3">
      <span><i class="fas fa-home me-1"></i> Welcome to Lightstorm - Inspired Living</span>
    </div>
    <div class="top-right d-flex gap-4">
      <span><i class="fas fa-location-dot me-1"></i> Nairobi, Kenya</span>
      <a [routerLink]="['/about']" class="text-decoration-none">About Us</a>
      <a [routerLink]="['/profile']" class="text-decoration-none">My Account</a>
    </div>
  </div>
</div>

<!-- Main Header -->
<header class="main-header py-3 bg-white shadow-sm border-bottom">
  <div class="container">
    <div class="row align-items-center">
      <!-- Logo -->
      <div class="col-6 col-lg-3 order-1">
        <a class="navbar-brand d-flex align-items-center" href="/">
          <img src="assets/images/solar/logo.png" alt="Lightstorm Technologies" class="header-logo">
        </a>
      </div>

      <!-- Search Bar -->
      <div class="col-12 col-lg-6 order-3 order-lg-2 mt-3 mt-lg-0">
        <div class="search-container d-flex">
          <div class="input-group">
            <button class="btn btn-outline-secondary dropdown-toggle d-none d-md-block" type="button"
              data-bs-toggle="dropdown">All</button>
            <input type="text" class="form-control" placeholder="I'm shopping for..." [(ngModel)]="searchQuery">
            <button class="btn btn-danger search-btn px-4" type="button">
              <span>Search</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="col-6 col-lg-3 order-2 order-lg-3 text-end d-flex justify-content-end align-items-center gap-4">
        <div class="contact-info d-none d-xl-flex align-items-center gap-2">
          <i class="fas fa-phone-alt text-danger fs-4"></i>
          <div class="text-start">
            <div class="small text-muted">Call or Whatsapp</div>
            <div class="fw-bold">+254 718 762 530</div>
          </div>
        </div>

        <div class="header-actions d-flex gap-3 align-items-center">
          <a class="text-secondary position-relative me-2" [routerLink]="['/cart']">
            <mat-icon class="fs-2" [matBadge]="data" matBadgeColor="warn">shopping_cart</mat-icon>
          </a>
          <button class="btn d-lg-none" type="button" [matMenuTriggerFor]="mobileMenu">
            <mat-icon>menu</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Navigation Bar -->
<nav class="nav-bar bg-primary-dark text-white d-none d-lg-block">
  <div class="container d-flex align-items-center">
    <div class="category-dropdown position-relative me-4" (mouseenter)="showCategories = true"
      (mouseleave)="showCategories = false">
      <button class="btn btn-category py-3 px-4 d-flex align-items-center gap-2 text-white">
        <mat-icon>menu</mat-icon>
        <span class="fw-bold">Shop By Category</span>
      </button>

      <div class="category-menu shadow" [class.show]="showCategories">
        <a *ngFor="let cat of categories" [routerLink]="['/products']" [queryParams]="{ category: cat.slug }"
          class="category-item d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-3">
            <mat-icon class="text-muted">{{cat.icon}}</mat-icon>
            <div class="d-flex flex-column">
              <span class="fw-bold">{{cat.name}}</span>
              <span class="small text-muted">{{cat.description}}</span>
            </div>
          </div>
          <mat-icon class="fs-6 text-muted">chevron_right</mat-icon>
        </a>
      </div>
    </div>

    <div class="main-nav-links d-flex gap-4 ms-2">
      <a [routerLink]="['/home']" class="nav-link text-white fw-bold py-3 active">Shop</a>
      <a [routerLink]="['/products']" class="nav-link text-white fw-bold py-3">Projects</a>
      <a [routerLink]="['/products']" class="nav-link text-white fw-bold py-3">Insights</a>
      <a [routerLink]="['/about']" class="nav-link text-white fw-bold py-3">About Us</a>
      <a href="#" class="nav-link text-white fw-bold py-3">Contact us</a>
    </div>

    <div class="ms-auto quick-support">
      <span class="small opacity-75">Quick Support:</span>
      <span class="fw-bold ms-2">0713 520 969</span>
    </div>
  </div>
</nav>

<!-- Mobile Menu -->
<mat-menu #mobileMenu="matMenu">
  <a mat-menu-item *ngFor="let cat of categories" [routerLink]="['/products']" [queryParams]="{ category: cat.slug }">
    <mat-icon>{{cat.icon}}</mat-icon>
    <span>{{cat.name}}</span>
  </a>
  <hr>
  <a mat-menu-item [routerLink]="['/about']">About Us</a>
  <a mat-menu-item [routerLink]="['/profile']">My Account</a>
</mat-menu>
