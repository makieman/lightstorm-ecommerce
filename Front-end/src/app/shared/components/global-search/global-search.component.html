<div class="relative w-full" #searchContainer>
  <!-- Search Input -->
  <div class="relative group">
    <span
      class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-[#EF4444] transition-colors">
      <i class="bi bi-search text-lg"></i>
    </span>
    <input type="text" [(ngModel)]="searchQuery" (input)="onInputChange($event)" (focus)="onFocus()"
      class="w-full !pl-12 !pr-12 !py-3.5 bg-slate-50 border-2 border-transparent rounded-2xl focus:bg-white focus:border-[#84CC16] focus:ring-0 transition-all text-sm font-medium placeholder:text-slate-400"
      placeholder="Search for 5kW Inverter, Solar Panels..." autocomplete="off">

    <!-- Loading Spinner -->
    <span *ngIf="isLoading" class="absolute right-4 top-1/2 -translate-y-1/2">
      <svg class="animate-spin h-5 w-5 text-[#84CC16]" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
        </path>
      </svg>
    </span>

    <!-- Clear Button -->
    <button *ngIf="searchQuery && !isLoading" (click)="searchQuery = ''; onInputChange('')"
      class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors">
      <i class="bi bi-x-circle-fill"></i>
    </button>
  </div>

  <!-- Dropdown -->
  <div *ngIf="isDropdownOpen"
    class="absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-2xl shadow-slate-200/50 border border-slate-100 overflow-hidden z-50 max-h-[500px] overflow-y-auto">

    <!-- Recent Searches -->
    <div *ngIf="searchQuery.length === 0 && recentSearches.length > 0" class="p-4">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest">Recent Searches</h3>
        <button (click)="clearRecentSearches($event)" class="text-[10px] font-bold text-[#EF4444] hover:underline">
          Clear All
        </button>
      </div>
      <div class="space-y-1">
        <button *ngFor="let search of recentSearches; let i = index" (click)="selectRecentSearch(search)"
          [class.bg-slate-50]="isActive(i)"
          class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-50 transition-colors text-left">
          <i class="bi bi-clock-history text-slate-400"></i>
          <span class="text-sm font-medium text-slate-700">{{ search }}</span>
          <i class="bi bi-arrow-up-left ml-auto text-slate-300 text-xs"></i>
        </button>
      </div>
    </div>

    <!-- Suggestions -->
    <div *ngIf="suggestions.length > 0" class="p-4">
      <!-- Categories Section -->
      <div *ngIf="hasCategories()" class="mb-4">
        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Categories</h3>
        <div class="space-y-1">
          <button *ngFor="let suggestion of getCategorySuggestions(); let i = index"
            (click)="selectSuggestion(suggestion)" [class.bg-slate-50]="isActive(getRecentSearches().length + i)"
            class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-50 transition-colors text-left group">
            <div
              class="w-10 h-10 rounded-xl bg-[#84CC16]/10 flex items-center justify-center text-[#84CC16] group-hover:bg-[#84CC16] group-hover:text-white transition-all">
              <i class="bi {{ suggestion.icon || 'bi-grid' }} text-lg"></i>
            </div>
            <div class="flex-1">
              <span class="text-sm font-bold text-slate-800 block">{{ suggestion.name }}</span>
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Category</span>
            </div>
            <i class="bi bi-arrow-right-short text-slate-300 group-hover:text-[#84CC16] transition-colors"></i>
          </button>
        </div>
      </div>

      <!-- Products Section -->
      <div *ngIf="hasProducts()">
        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Products</h3>
        <div class="space-y-1">
          <button *ngFor="let suggestion of getProductSuggestions(); let i = index"
            (click)="selectSuggestion(suggestion)"
            [class.bg-slate-50]="isActive(getRecentSearches().length + getCategorySuggestions().length + i)"
            class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-50 transition-colors text-left group">
            <div class="w-12 h-12 rounded-lg bg-slate-100 flex items-center justify-center overflow-hidden">
              <i class="bi bi-box text-slate-300 text-xl"></i>
            </div>
            <div class="flex-1 min-w-0">
              <span class="text-sm font-bold text-slate-800 block truncate">{{ suggestion.name }}</span>
              <div class="flex items-center gap-2">
                <span class="text-xs font-black text-[#84CC16]">{{ formatPrice(suggestion.price) }}</span>
                <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                <span class="text-[10px] font-bold uppercase tracking-wider"
                  [class]="getAvailabilityColor(suggestion.availability)">
                  {{ suggestion.availability }}
                </span>
              </div>
            </div>
            <i class="bi bi-chevron-right text-slate-300 group-hover:text-[#84CC16] transition-colors text-sm"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- No Results -->
    <div *ngIf="searchQuery.length >= 2 && !isLoading && suggestions.length === 0" class="p-8 text-center">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-slate-50 flex items-center justify-center">
        <i class="bi bi-search text-2xl text-slate-300"></i>
      </div>
      <h3 class="text-sm font-bold text-slate-700 mb-1">No results found</h3>
      <p class="text-xs text-slate-400">Try searching for "Solar Panel" or "Inverter"</p>
    </div>

    <!-- Search Button -->
    <div *ngIf="searchQuery.length > 0" class="border-t border-slate-100 p-3 bg-slate-50/50">
      <button (click)="executeSearch()"
        class="w-full py-3 bg-[#1E293B] text-white rounded-xl font-bold text-sm hover:bg-[#334155] transition-colors flex items-center justify-center gap-2">
        <i class="bi bi-search"></i>
        Search for "{{ searchQuery }}"
      </button>
    </div>

    <!-- Tip -->
    <div class="px-4 py-2 bg-slate-50 border-t border-slate-100">
      <p class="text-[10px] text-slate-400 text-center">
        <i class="bi bi-info-circle mr-1"></i>
        Press <kbd class="px-1.5 py-0.5 bg-white rounded text-xs font-mono border border-slate-200">Enter</kbd> to
        search, <kbd class="px-1.5 py-0.5 bg-white rounded text-xs font-mono border border-slate-200">↓</kbd> <kbd
          class="px-1.5 py-0.5 bg-white rounded text-xs font-mono border border-slate-200">↑</kbd> to navigate
      </p>
    </div>
  </div>
</div>
