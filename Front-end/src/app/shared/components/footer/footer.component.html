<!-- Social Connection Section -->
<section class="relative h-[300px] w-full overflow-hidden flex items-center justify-center">
    <img alt="Connect with us" class="absolute inset-0 w-full h-full object-cover"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDTD_Spk_p94BL3FtLxISI3uA1vDEM2ndlGtfngq3StjOc8z2E1u7892sh5eh6fyYpybHLrsLgaVaYCUsACoVew-BVl-oTasEvnpaRSX0N71-Hd9dGos_H4qAriSYMWW1_Fw9LBZNCMuX4ST-BSJE1rSyi15-TGQZV5GATDR_0v8weI0TVnGeQSRYih8mWxpwpLw43yoYdrxXV8iLRRmRBT8BZb1ZnPpzQnoCl572X5I_PYbPQzvJW2OyBbn7_4z5rQUEfPo5eIys0" />
    <div
        class="absolute inset-0 bg-gradient-to-t from-[#1E293B] via-[#1E293B]/60 to-[#1E293B]/30 flex flex-col items-center justify-center text-center p-8">
        <h2 class="text-white text-3xl font-black mb-8 tracking-tight uppercase">Connect with Us</h2>
        <div class="flex gap-6">
            <a class="w-12 h-12 rounded-full border border-white/40 flex items-center justify-center text-white transition-all hover:bg-[#EF4444] hover:border-[#EF4444] active:scale-90"
                href="https://web.facebook.com/lightstormtech" target="_blank" rel="noopener noreferrer">
                <i class="bi bi-facebook text-xl"></i>
            </a>
            <a class="w-12 h-12 rounded-full border border-white/40 flex items-center justify-center text-white transition-all hover:bg-[#EF4444] hover:border-[#EF4444] active:scale-90"
                href="https://x.com/LightstormTech" target="_blank" rel="noopener noreferrer">
                <i class="bi bi-twitter-x text-xl"></i>
            </a>
            <a class="w-12 h-12 rounded-full border border-white/40 flex items-center justify-center text-white transition-all hover:bg-[#EF4444] hover:border-[#EF4444] active:scale-90"
                href="https://www.instagram.com/lightstorm_technologies/" target="_blank" rel="noopener noreferrer">
                <i class="bi bi-instagram text-xl"></i>
            </a>
        </div>
    </div>
</section>

<!-- Main Footer -->
<footer class="bg-slate-50 dark:bg-slate-900/50 px-6 py-16 pb-32 md:pb-16 border-t border-slate-100">
    <div class="max-w-7xl mx-auto">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-x-8 gap-y-12">
            <div>
                <h4 class="text-[#1E293B] font-black text-xs mb-6 uppercase tracking-[0.2em]">Energy Solutions</h4>
                <nav class="flex flex-col gap-3">
                    <a class="text-slate-500 text-sm font-bold hover:text-[#84CC16] transition-colors"
                        [routerLink]="['/products']">All Solutions</a>
                    <a class="text-slate-500 text-sm font-bold hover:text-[#84CC16] transition-colors"
                        [routerLink]="['/products']" [queryParams]="{ category: 'Solar Panel' }">Solar Panels</a>
                    <a class="text-slate-500 text-sm font-bold hover:text-[#84CC16] transition-colors"
                        [routerLink]="['/products']" [queryParams]="{ category: 'Inverter' }">Inverters</a>
                    <a class="text-slate-500 text-sm font-bold hover:text-[#84CC16] transition-colors"
                        [routerLink]="['/products']" [queryParams]="{ category: 'Charge Controller' }">Controllers</a>
                </nav>
            </div>

            <div>
                <h4 class="text-[#1E293B] font-black text-xs mb-6 uppercase tracking-[0.2em]">Customer Portal</h4>
                <nav class="flex flex-col gap-3">
                    <a class="text-slate-500 text-sm font-bold hover:text-[#84CC16] transition-colors"
                        [routerLink]="['/login']">Login</a>
                    <a class="text-slate-500 text-sm font-bold hover:text-[#84CC16] transition-colors"
                        [routerLink]="['/register']">Sign Up</a>
                    <a class="text-slate-500 text-sm font-bold hover:text-[#84CC16] transition-colors"
                        [routerLink]="['/profile']">My Profile</a>
                </nav>
            </div>

            <div>
                <h4 class="text-[#1E293B] font-black text-xs mb-6 uppercase tracking-[0.2em]">Quick Links</h4>
                <nav class="flex flex-col gap-3">
                    <a class="text-slate-500 text-sm font-bold hover:text-[#84CC16] transition-colors"
                        [routerLink]="['/cart']">Shopping Cart</a>
                    <a class="text-slate-500 text-sm font-bold hover:text-[#84CC16] transition-colors"
                        [routerLink]="['/about']">About Lightstorm</a>
                    <a class="text-slate-500 text-sm font-bold hover:text-[#84CC16] transition-colors"
                        href="#">Sustainability</a>
                </nav>
            </div>

            <div class="col-span-2 md:col-span-1">
                <h4 class="text-[#1E293B] font-black text-xs mb-6 uppercase tracking-[0.2em]">Support</h4>
                <div class="flex flex-col gap-4">
                    <button
                        class="w-full bg-[#1E293B] text-white py-4 px-6 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-[#EF4444] transition-all shadow-lg shadow-slate-200">
                        Contact Support
                    </button>
                    <a href="https://wa.me/254700250499"
                        class="w-full bg-[#84CC16] text-white py-4 px-6 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg shadow-green-500/20 flex items-center justify-center gap-2 hover:scale-[1.02] transition-all">
                        <i class="bi bi-whatsapp"></i> Get Quote
                    </a>
                </div>
            </div>
        </div>

        <div class="mt-20 pt-8 border-t border-slate-200 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <img src="assets/lightstorm logo.png" alt="Lightstorm"
                    class="h-6 w-auto opacity-50 grayscale hover:opacity-100 hover:grayscale-0 transition-all">
                <p class="text-[10px] text-slate-400 font-black tracking-[0.2em] uppercase">© 2024 - INSPIRED living</p>
            </div>
            <div class="flex gap-6">
                <span class="text-[10px] text-slate-400 font-black uppercase tracking-widest">Privacy Policy</span>
                <span class="text-[10px] text-slate-400 font-black uppercase tracking-widest">Terms of Service</span>
            </div>
        </div>
    </div>
</footer>

<!-- Mobile Quick Navigation -->
<div
    class="md:hidden fixed bottom-0 left-0 right-0 z-[100] bg-white/95 backdrop-blur-xl border-t border-slate-100 px-8 pt-3 pb-8 flex justify-between items-center shadow-[0_-8px_30px_rgb(0,0,0,0.04)]">
    <a [routerLink]="['/home']" routerLinkActive="text-[#EF4444]" [routerLinkActiveOptions]="{exact: true}"
        class="flex flex-col items-center gap-1 text-slate-400 hover:text-[#EF4444] transition-colors">
        <i class="bi bi-house-door-fill text-xl"></i>
        <span class="text-[9px] font-black uppercase tracking-tighter">Home</span>
    </a>
    <a [routerLink]="['/products']" routerLinkActive="text-[#EF4444]"
        class="flex flex-col items-center gap-1 text-slate-400 hover:text-[#EF4444] transition-colors">
        <i class="bi bi-grid-fill text-xl"></i>
        <span class="text-[9px] font-black uppercase tracking-tighter">Shop</span>
    </a>
    <a [routerLink]="['/cart']" routerLinkActive="text-[#EF4444]"
        class="flex flex-col items-center gap-1 text-slate-400 hover:text-[#EF4444] transition-colors">
        <i class="bi bi-bag-fill text-xl"></i>
        <span class="text-[9px] font-black uppercase tracking-tighter">Cart</span>
    </a>
    <a [routerLink]="['/profile']" routerLinkActive="text-[#EF4444]"
        class="flex flex-col items-center gap-1 text-slate-400 hover:text-[#EF4444] transition-colors">
        <i class="bi bi-person-fill text-xl"></i>
        <span class="text-[9px] font-black uppercase tracking-tighter">Account</span>
    </a>
    <button class="flex flex-col items-center gap-1 text-slate-400">
        <i class="bi bi-three-dots text-xl"></i>
        <span class="text-[9px] font-black uppercase tracking-tighter">More</span>
    </button>
</div>
