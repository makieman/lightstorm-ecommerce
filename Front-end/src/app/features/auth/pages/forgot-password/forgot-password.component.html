<app-auth-shell activeTab="login" heading="Reset Password"
  subheading="Enter your email to receive a password reset link">

  <ng-container auth-banner>
    <div *ngIf="success" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-2xl">
      <div class="flex items-center gap-2 text-green-700">
        <span class="material-symbols-outlined text-lg">check_circle</span>
        <span class="text-sm font-medium">Reset link sent! Please check your email inbox.</span>
      </div>
    </div>
    
    <div *ngIf="error" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-2xl">
      <div class="flex items-center gap-2 text-red-700">
        <span class="material-symbols-outlined text-lg">error</span>
        <span class="text-sm font-medium">{{ error }}</span>
      </div>
    </div>
  </ng-container>

  <form auth-form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!success" class="space-y-5 sm:space-y-6">
    
    <div class="relative group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" [class.hidden]="emailFocused && form.get('email')?.value">
        <span
          class="material-symbols-outlined text-gray-400 group-focus-within:text-[var(--primary-bg)] transition-colors text-xl">alternate_email</span>
      </div>
      <input formControlName="email" (focus)="emailFocused = true" (blur)="emailFocused = false"
        class="custom-input block w-full !pl-14 pr-4 py-4 bg-slate-50 border border-transparent rounded-2xl transition-all text-[var(--text-dark)] placeholder-transparent"
        type="email" placeholder="example@email.com" />
    </div>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 sm:gap-6 pt-2 sm:pt-4">
      <button type="submit" [disabled]="form.invalid || loading"
        class="w-full sm:w-auto px-8 py-4 bg-[var(--accent-coral)] text-white border-0 font-bold rounded-2xl shadow-lg hover:shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3 disabled:opacity-50 disabled:cursor-not-allowed">
        <span>{{ loading ? 'Sending...' : 'Send Reset Link' }}</span>
        <span class="material-symbols-outlined" *ngIf="!loading">send</span>
      </button>
      <div class="flex items-center justify-center sm:justify-start gap-2 text-sm text-[var(--text-muted)]">
        <span class="material-symbols-outlined text-gray-400 text-lg">arrow_back</span>
        <a routerLink="/login" class="font-medium hover:text-[var(--text-dark)] transition-colors text-decoration-none">Back to Login</a>
      </div>
    </div>
  </form>

  <div *ngIf="success" auth-form class="flex justify-center mt-4">
    <a routerLink="/login" class="px-6 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition-colors text-decoration-none">
      Return to Login
    </a>
  </div>

</app-auth-shell>
