<app-auth-shell activeTab="register" heading="Welcome to Lightstorm"
  subheading="Please enter your details to create an account">
  <form auth-form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
    <div class="relative group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" [class.hidden]="usernameFocused && form.get('username')?.value">
        <span
          class="material-symbols-outlined text-gray-400 group-focus-within:text-[var(--primary-bg)] transition-colors text-xl">person</span>
      </div>
      <input formControlName="username" (focus)="usernameFocused = true" (blur)="usernameFocused = false"
        class="custom-input block w-full !pl-14 pr-4 py-3.5 bg-slate-50 border border-transparent rounded-2xl transition-all text-[var(--text-dark)] placeholder-transparent"
        type="text" />
      <div *ngIf="form.get('username')!.invalid && (form.get('username')!.dirty || form.get('username')!.touched)"
        class="text-red-500 text-xs mt-1 ml-2">
        <span>{{ usernameError }}</span>
      </div>
    </div>

    <div class="relative group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" [class.hidden]="emailFocused && form.get('email')?.value">
        <span
          class="material-symbols-outlined text-gray-400 group-focus-within:text-[var(--primary-bg)] transition-colors text-xl">alternate_email</span>
      </div>
      <input formControlName="email" (focus)="emailFocused = true" (blur)="emailFocused = false"
        class="custom-input block w-full !pl-14 pr-4 py-3.5 bg-slate-50 border border-transparent rounded-2xl transition-all text-[var(--text-dark)] placeholder-transparent"
        type="email" />
      <div *ngIf="form.get('email')!.invalid && (form.get('email')!.dirty || form.get('email')!.touched)"
        class="text-red-500 text-xs mt-1 ml-2">
        <span>{{ emailError }}</span>
      </div>
    </div>

    <div class="relative group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" [class.hidden]="passwordFocused && form.get('password')?.value">
        <span
          class="material-symbols-outlined text-gray-400 group-focus-within:text-[var(--primary-bg)] transition-colors text-xl">lock</span>
      </div>
      <input [type]="showPassword ? 'text' : 'password'" formControlName="password" (focus)="passwordFocused = true" (blur)="passwordFocused = false"
        class="custom-input block w-full !pl-14 pr-4 py-3.5 bg-slate-50 border border-transparent rounded-2xl transition-all text-[var(--text-dark)] placeholder-transparent"
        />
      <button class="absolute top-3.5 right-0 pr-4 flex items-center bg-transparent border-0 outline-none"
        type="button" (click)="showPassword = !showPassword">
      </button>
      <div *ngIf="form.get('password')!.invalid && (form.get('password')!.dirty || form.get('password')!.touched)"
        class="text-red-500 text-xs mt-1 ml-2">
        <span>{{ passwordError }}</span>
      </div>
    </div>

    <div class="relative group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" [class.hidden]="confirmPasswordFocused && form.get('confirmPassword')?.value">
        <span
          class="material-symbols-outlined text-gray-400 group-focus-within:text-[var(--primary-bg)] transition-colors text-xl">lock_check</span>
      </div>
      <input [type]="showConPassword ? 'text' : 'password'" formControlName="confirmPassword" (focus)="confirmPasswordFocused = true" (blur)="confirmPasswordFocused = false"
        class="custom-input block w-full !pl-14 pr-4 py-3.5 bg-slate-50 border border-transparent rounded-2xl transition-all text-[var(--text-dark)] placeholder-transparent"
        />
      <button class="absolute top-3.5 right-0 pr-4 flex items-center bg-transparent border-0 outline-none"
        type="button" (click)="showConPassword = !showConPassword">
      </button>
      <div
        *ngIf="form.get('confirmPassword')!.invalid && (form.get('confirmPassword')!.dirty || form.get('confirmPassword')!.touched)"
        class="text-red-500 text-xs mt-1 ml-2">
        <span>{{ confirmPasswordError }}</span>
      </div>
      <div *ngIf="passwordMismatch" class="text-red-500 text-xs mt-1 ml-2">
        Passwords do not match. Please re-enter to confirm.
      </div>
    </div>

    <p class="text-xs text-[var(--text-muted)] mt-2">
      By signing up, you agree to our <a class="text-[var(--primary-bg)] font-semibold underline" href="#">Terms
        &amp; Conditions</a>
    </p>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 sm:gap-6 pt-2">
      <button type="submit" [disabled]="form.invalid || passwordMismatch"
        class="w-full sm:w-auto px-8 py-3.5 bg-[var(--accent-coral)] text-white border-0 font-bold rounded-2xl shadow-lg hover:shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3 disabled:opacity-50 disabled:cursor-not-allowed">
        <span>Create Account</span>
        <span class="material-symbols-outlined text-lg">arrow_forward</span>
      </button>
    </div>
  </form>

  <div auth-footer class="mt-10 text-center text-sm text-[var(--text-muted)]">
    Already have an account? <a routerLink="/login"
      class="text-[var(--accent-coral)] font-bold text-decoration-none hover:underline">Log in here</a>
  </div>
</app-auth-shell>
