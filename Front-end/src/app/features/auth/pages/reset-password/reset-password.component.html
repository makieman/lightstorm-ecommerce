<app-auth-shell activeTab="login" heading="Create New Password"
  subheading="Please enter your new password below">

  <ng-container auth-banner>
    <div *ngIf="success" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-2xl">
      <div class="flex items-center gap-2 text-green-700">
        <span class="material-symbols-outlined text-lg">check_circle</span>
        <span class="text-sm font-medium">Password updated successfully! Redirecting to login...</span>
      </div>
    </div>
    
    <div *ngIf="error" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-2xl">
      <div class="flex items-center gap-2 text-red-700">
        <span class="material-symbols-outlined text-lg">error</span>
        <span class="text-sm font-medium">{{ error }}</span>
      </div>
    </div>
  </ng-container>

  <form auth-form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!success" class="space-y-5 sm:space-y-6">
    
    <div class="relative group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" [class.hidden]="passwordFocused && form.get('password')?.value">
        <span
          class="material-symbols-outlined text-gray-400 group-focus-within:text-[var(--primary-bg)] transition-colors text-xl">lock</span>
      </div>
      <input formControlName="password" (focus)="passwordFocused = true" (blur)="passwordFocused = false"
        class="custom-input block w-full !pl-14 pr-4 py-4 bg-slate-50 border border-transparent rounded-2xl transition-all text-[var(--text-dark)] placeholder-transparent"
        type="password" placeholder="New Password" />
    </div>

    <div class="relative group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" [class.hidden]="confirmFocused && form.get('confirmPassword')?.value">
        <span
          class="material-symbols-outlined text-gray-400 group-focus-within:text-[var(--primary-bg)] transition-colors text-xl">lock</span>
      </div>
      <input formControlName="confirmPassword" (focus)="confirmFocused = true" (blur)="confirmFocused = false"
        class="custom-input block w-full !pl-14 pr-4 py-4 bg-slate-50 border border-transparent rounded-2xl transition-all text-[var(--text-dark)] placeholder-transparent"
        type="password" placeholder="Confirm Password" />
    </div>
    <div *ngIf="form.hasError('mismatch') && form.get('confirmPassword')?.touched" class="text-xs text-red-500 mt-1">
      Passwords do not match
    </div>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 sm:gap-6 pt-2 sm:pt-4">
      <button type="submit" [disabled]="form.invalid || loading || !token"
        class="w-full sm:w-auto px-8 py-4 bg-[var(--accent-coral)] text-white border-0 font-bold rounded-2xl shadow-lg hover:shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3 disabled:opacity-50 disabled:cursor-not-allowed">
        <span>{{ loading ? 'Updating...' : 'Reset Password' }}</span>
        <span class="material-symbols-outlined" *ngIf="!loading">lock_reset</span>
      </button>
    </div>
  </form>

</app-auth-shell>
