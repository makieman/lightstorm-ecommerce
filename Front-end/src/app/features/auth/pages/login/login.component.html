<app-auth-shell activeTab="login" heading="Welcome Back"
  subheading="Please enter your details to log in to your account">
  <ng-container auth-banner>
    <div *ngIf="showVerificationBanner && !resendSent"
      class="verification-banner mb-6 p-4 bg-amber-50 border border-amber-200 rounded-2xl">
      <div class="flex items-start gap-3">
        <span class="material-symbols-outlined text-amber-500 mt-0.5">warning</span>
        <div class="flex-1">
          <p class="text-sm font-semibold text-amber-800 mb-1">Email not verified</p>
          <p class="text-xs text-amber-700 mb-3">Please verify your email before logging in. Check your inbox for
            the verification link.</p>
          <button (click)="resendVerification()" [disabled]="resendLoading"
            class="text-xs font-bold text-white bg-amber-500 hover:bg-amber-600 px-4 py-2 rounded-xl transition-all inline-flex items-center gap-1.5 border-0 disabled:opacity-50">
            <span class="material-symbols-outlined text-sm" *ngIf="!resendLoading">mail</span>
            <span>{{ resendLoading ? 'Sending...' : 'Resend Verification Email' }}</span>
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="resendSent" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-2xl">
      <div class="flex items-center gap-2 text-green-700">
        <span class="material-symbols-outlined text-lg">check_circle</span>
        <span class="text-sm font-medium">Verification email sent! Check your inbox.</span>
      </div>
    </div>
  </ng-container>

  <form auth-form [formGroup]="form" (ngSubmit)="login()" class="space-y-5 sm:space-y-6">
    <a [href]="googleAuthUrl"
      class="w-full flex items-center justify-center gap-3 border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 font-semibold py-3 rounded-xl transition-all duration-200 text-sm mb-4 text-decoration-none">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
      </svg>
      Continue with Google
    </a>

    <div class="flex items-center gap-3 mb-4">
      <div class="flex-1 h-px bg-gray-200"></div>
      <span class="text-xs text-gray-400 font-medium uppercase tracking-wider">or</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <div class="relative group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" [class.hidden]="emailFocused && form.get('email')?.value">
        <span
          class="material-symbols-outlined text-gray-400 group-focus-within:text-[var(--primary-bg)] transition-colors text-xl">alternate_email</span>
      </div>
      <input formControlName="email" (focus)="emailFocused = true" (blur)="emailFocused = false"
        class="custom-input block w-full !pl-14 pr-4 py-4 bg-slate-50 border border-transparent rounded-2xl transition-all text-[var(--text-dark)] placeholder-transparent"
        type="email" />
    </div>

    <div class="relative group">
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" [class.hidden]="passwordFocused && form.get('password')?.value">
        <span
          class="material-symbols-outlined text-gray-400 group-focus-within:text-[var(--primary-bg)] transition-colors text-xl">lock</span>
      </div>
      <input [type]="showPassword ? 'text' : 'password'" formControlName="password" (focus)="passwordFocused = true" (blur)="passwordFocused = false"
        class="custom-input block w-full !pl-14 pr-4 py-4 bg-slate-50 border border-transparent rounded-2xl transition-all text-[var(--text-dark)] placeholder-transparent"
        />
      <button class="absolute inset-y-0 right-0 pr-4 flex items-center bg-transparent border-0 outline-none"
        type="button" (click)="showPassword = !showPassword">
      </button>
    </div>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 sm:gap-6 pt-2 sm:pt-4">
      <button type="submit" [disabled]="form.invalid"
        class="w-full sm:w-auto px-8 py-4 bg-[var(--accent-coral)] text-white border-0 font-bold rounded-2xl shadow-lg hover:shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3 disabled:opacity-50 disabled:cursor-not-allowed">
        <span>Log In</span>
        <span class="material-symbols-outlined">login</span>
      </button>
      <div class="flex items-center justify-center sm:justify-start gap-2 text-sm text-[var(--text-muted)]">
        <span class="material-symbols-outlined text-gray-400 text-lg">lock_reset</span>
        <a class="font-medium hover:text-[var(--text-dark)] transition-colors text-decoration-none" routerLink="/forgot-password">Forgot
          Password?</a>
      </div>
    </div>
  </form>

  <div auth-footer class="mt-10 sm:mt-12 text-center text-sm text-[var(--text-muted)]">
    Don't have an account? <a routerLink="/register"
      class="text-[var(--accent-coral)] font-bold text-decoration-none hover:underline">Sign up here</a>
  </div>
</app-auth-shell>
