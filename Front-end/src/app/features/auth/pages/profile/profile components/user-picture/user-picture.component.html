<div class="flex flex-col items-center text-center py-2">
  <img 
    [src]="userInfo && userInfo.image ? userInfo.image : 'https://res.cloudinary.com/dh7osyxvl/image/upload/v1714489565/Users/pngwing.com_10_lnfy4w.png'" 
    alt="User" 
    class="w-[150px] h-[150px] object-cover rounded-full shadow-sm border-4 border-white"
  >
  <div class="mt-4">
    @if (userInfo) {
      <h4 class="text-xl font-bold text-slate-800">{{userInfo.username}}</h4>
    }
    <p class="text-sm text-slate-500 font-medium">Normal User</p>
  </div>
</div>
