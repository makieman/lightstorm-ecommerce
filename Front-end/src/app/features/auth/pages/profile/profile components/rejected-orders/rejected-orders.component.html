<div class="bg-surface-container-lowest p-6 rounded-xl border border-surface-container h-full flex flex-col">
  <div class="flex items-center gap-3 mb-6">
    <div class="w-10 h-10 rounded-full bg-error-container/20 flex items-center justify-center shrink-0">
      <span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">cancel</span>
    </div>
    <h3 class="font-bold text-sm uppercase tracking-widest text-on-surface">Cancelled Orders</h3>
  </div>

  <div *ngIf="rejectedOrders.length > 0; else noOrders" class="space-y-4 flex-grow">
    @for (o of rejectedOrders; track o._id) {
      <div class="flex flex-col sm:flex-row justify-between sm:items-center p-4 bg-surface rounded-lg gap-3 sm:gap-0 transition-colors hover:bg-surface-container-low">
        <div>
          <p class="text-xs font-bold text-on-surface font-mono break-all sm:break-normal">{{o._id}}</p>
          <p class="text-[10px] text-on-surface-variant mt-0.5">Cancelled Recently</p>
        </div>
        <button (click)="openDialog(o._id)" class="text-[10px] font-bold text-error uppercase tracking-widest hover:underline decoration-2 underline-offset-4 self-start sm:self-auto shrink-0">
          View Details
        </button>
      </div>
    }
  </div>

  <ng-template #noOrders>
    <div class="flex flex-col items-center justify-center flex-grow py-8 opacity-50">
      <span class="material-symbols-outlined text-4xl mb-2 text-on-surface-variant">history_toggle_off</span>
      <p class="text-xs font-medium text-on-surface-variant">No cancelled orders to display</p>
    </div>
  </ng-template>
</div>
