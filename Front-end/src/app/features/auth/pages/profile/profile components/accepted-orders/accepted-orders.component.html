<div class="flex items-center justify-between mb-4">
  <h6 class="text-lg font-bold text-slate-800 m-0">Accepted Orders</h6>
  <span class="material-symbols-outlined text-green-500 text-3xl">check_circle</span>
</div>

<div *ngIf="acceptedOrders.length > 0; else noOrders" class="space-y-4">
  @for (o of acceptedOrders; track o._id) {
    <div class="bg-green-50/50 border border-green-100 rounded-xl p-4 flex flex-col gap-3 transition-all">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1">
        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Order ID</span>
        <span class="text-sm font-bold text-slate-700 font-mono break-all">{{o._id}}</span>
      </div>
      
      <div class="flex justify-end gap-2 pt-2 border-t border-green-200/60 mt-2">
        <button (click)="openDialog(o._id)" class="px-3 py-1.5 text-xs font-bold text-white bg-blue-500 hover:bg-blue-600 rounded-lg transition-colors border-0">
          View
        </button>
      </div>
    </div>
  }
</div>

<ng-template #noOrders>
  <div class="text-sm text-slate-500 italic py-4 text-center bg-slate-50 rounded-xl border border-dashed border-slate-200">
    You don't have any accepted orders.
  </div>
</ng-template>
