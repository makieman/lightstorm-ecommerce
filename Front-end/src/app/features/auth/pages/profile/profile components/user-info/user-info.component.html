<div class="bg-surface-container-lowest rounded-xl p-6 sm:p-8 shadow-sm border border-surface-container">
  <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-6 sm:mb-8 gap-4 sm:gap-0">
    <h2 class="text-xl font-bold tracking-tight text-on-surface">Personal Information</h2>
    <button (click)="openDialog()" class="text-secondary font-bold text-xs uppercase tracking-widest hover:underline decoration-2 underline-offset-4 self-start sm:self-auto">
      Update Details
    </button>
  </div>
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-6 sm:gap-y-8">
    <div class="space-y-1.5">
      <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">User Name</label>
      <p class="text-on-surface font-medium border-b border-surface-container py-2">
        @if(userInfo){ {{userInfo.username}} } @else { - }
      </p>
    </div>
    <div class="space-y-1.5">
      <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">Email Address</label>
      <p class="text-on-surface font-medium border-b border-surface-container py-2 break-all sm:break-normal">
        @if(userInfo){ {{userInfo.email}} } @else { - }
      </p>
    </div>
    <div class="space-y-1.5">
      <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">Primary Contact</label>
      <p class="text-on-surface font-medium border-b border-surface-container py-2 text-on-surface-variant">
        Add phone number
      </p>
    </div>
    <div class="space-y-1.5">
      <label class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">Member Since</label>
      <p class="text-on-surface font-medium border-b border-surface-container py-2 text-on-surface-variant">
        Today
      </p>
    </div>
  </div>
</div>
