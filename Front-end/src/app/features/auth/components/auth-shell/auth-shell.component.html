<div class="auth-shell min-h-screen flex items-center justify-center overflow-x-hidden p-0 m-0 w-full"
  style="background-color: var(--primary-bg); font-family: 'Plus Jakarta Sans', sans-serif;">
  <div class="auth-layout w-full max-w-[1440px] flex relative overflow-hidden">
    <div class="hidden lg:flex flex-1 flex-col p-12 relative z-10 w-1/2">
      <div class="flex items-center gap-2 mb-20 cursor-pointer" routerLink="/">
        <div class="w-10 h-10 bg-[var(--accent-coral)] rounded-lg flex items-center justify-center shadow-md">
          <span class="material-symbols-outlined text-white">bolt</span>
        </div>
        <span class="text-white text-2xl font-bold tracking-tight">Lightstorm</span>
      </div>

      <div class="flex-1 flex flex-col justify-center max-w-lg mx-auto w-full">
        <h1 class="text-5xl font-extrabold text-white leading-tight mb-6">
          Powering the future with clean energy.
        </h1>
        <p class="text-slate-300 text-lg opacity-90 mb-12">
          Join thousands of households making the switch to sustainable living today.
        </p>

        <div class="relative w-full aspect-video">
          <svg class="w-full h-full drop-shadow-2xl" viewBox="0 0 400 300">
            <path d="M0,280 Q200,260 400,280 L400,300 L0,300 Z" fill="#334155"></path>
            <g transform="translate(100, 100)">
              <rect fill="#475569" height="180" width="4" x="18" y="0"></rect>
              <g class="animate-spin-slow origin-center" style="transform-origin: 20px 0px;">
                <path d="M20,0 L60,-5 L20,5 Z" fill="#E2E8F0"></path>
                <path d="M20,0 L-20,-40 L15,-10 Z" fill="#E2E8F0"></path>
                <path d="M20,0 L-20,40 L15,10 Z" fill="#E2E8F0"></path>
              </g>
            </g>
            <g transform="translate(250, 150) scale(0.8)">
              <rect fill="#475569" height="130" width="4" x="18" y="0"></rect>
              <g class="animate-spin-slow" style="transform-origin: 20px 0px;">
                <path d="M20,0 L60,-5 L20,5 Z" fill="#CBD5E1"></path>
                <path d="M20,0 L-20,-40 L15,-10 Z" fill="#CBD5E1"></path>
                <path d="M20,0 L-20,40 L15,10 Z" fill="#CBD5E1"></path>
              </g>
            </g>
            <rect fill="#0F172A" height="30" rx="2" transform="skewX(-20)" width="60" x="40" y="240"></rect>
            <rect fill="#0F172A" height="25" rx="2" transform="skewX(-20)" width="50" x="120" y="245"></rect>
            <circle cx="90" cy="235" fill="var(--accent-coral)" r="5"></circle>
            <rect fill="var(--accent-coral)" height="15" rx="2" width="10" x="85" y="240"></rect>
            <circle cx="200" cy="255" fill="#38BDF8" r="5"></circle>
            <rect fill="#38BDF8" height="15" rx="2" width="10" x="195" y="260"></rect>
          </svg>
        </div>
      </div>

      <div class="flex gap-8 text-slate-300 text-sm font-medium mt-auto mx-auto w-full max-w-lg mb-8">
        <a class="hover:text-white transition-colors cursor-pointer" routerLink="/home">Home</a>
        <a class="hover:text-white transition-colors cursor-pointer" routerLink="/shop">Marketplace</a>
        <a class="hover:text-white transition-colors cursor-pointer" href="#">Support</a>
      </div>
    </div>

    <div
      class="auth-panel w-full lg:w-[580px] bg-white lg:form-card flex flex-col justify-center p-6 sm:p-8 md:p-12 lg:p-20 shadow-2xl overflow-y-auto">
      <div class="max-w-md mx-auto w-full">
        <div class="auth-topbar flex flex-wrap items-center justify-between gap-4 mb-8 sm:mb-12">
          <div class="lg:hidden flex items-center gap-2 cursor-pointer" routerLink="/">
            <div class="w-8 h-8 bg-[var(--accent-coral)] rounded flex items-center justify-center">
              <span class="material-symbols-outlined text-white text-sm">bolt</span>
            </div>
            <span class="text-[var(--primary-bg)] font-bold">Lightstorm</span>
          </div>
          <div class="flex w-full sm:w-auto gap-2 sm:ml-auto">
            <a routerLink="/login"
              class="flex-1 sm:flex-none px-4 sm:px-5 py-2.5 text-sm font-semibold rounded-full transition-all flex items-center justify-center text-center no-underline"
              [ngClass]="activeTab === 'login'
                ? 'text-white bg-[var(--primary-bg)] cursor-default pointer-events-none'
                : 'text-[var(--text-dark)] hover:bg-gray-100'">
              Log In
            </a>
            <a routerLink="/register"
              class="flex-1 sm:flex-none px-4 sm:px-5 py-2.5 text-sm font-semibold rounded-full transition-all flex items-center justify-center text-center no-underline"
              [ngClass]="activeTab === 'register'
                ? 'text-white bg-[var(--primary-bg)] cursor-default pointer-events-none'
                : 'text-[var(--text-dark)] hover:bg-gray-100'">
              Sign Up
            </a>
          </div>
        </div>

        <ng-content select="[auth-banner]"></ng-content>

        <div class="mb-8 sm:mb-10">
          <h2 class="text-2xl sm:text-3xl font-bold text-[var(--text-dark)] mb-2">{{ heading }}</h2>
          <p class="text-[var(--text-muted)]">{{ subheading }}</p>
        </div>

        <ng-content select="[auth-form]"></ng-content>
        <ng-content select="[auth-footer]"></ng-content>
      </div>
    </div>
  </div>
</div>
