<div class="admin-shell flex min-h-screen bg-gray-50 relative">
  <app-admin-sidebar [isOpen]="sidebarOpen" (toggle)="sidebarOpen = $event" (logout)="logout()"></app-admin-sidebar>

  <main class="flex-1 flex flex-col min-w-0 overflow-hidden w-full">
    <header
      class="p-3 md:p-4 mx-3 md:mx-6 my-3 md:my-4 bg-[#1E293B] rounded-2xl flex items-center justify-between px-4 md:px-8 sticky top-0 z-10 shadow-lg shadow-slate-200">
      <div class="flex items-center gap-3 md:gap-4">
        <button class="md:hidden text-slate-300 hover:text-white p-1 transition-colors" (click)="toggleSidebar()">
          <i class="bi bi-list text-2xl"></i>
        </button>
        <h2 class="text-xs font-black tracking-[0.2em] text-white uppercase hidden sm:block">System Overview</h2>
      </div>

      <div class="flex items-center gap-6">
        <button class="relative p-2 rounded-xl bg-slate-700/50 text-slate-300 hover:text-white transition-colors">
          <i class="bi bi-bell"></i>
          <span class="absolute top-2 right-2 w-2 h-2 bg-[#EF4444] rounded-full border border-[#1E293B]"></span>
        </button>
        <div class="h-6 w-px bg-slate-700"></div>
        <div class="flex items-center gap-3">
          <div class="text-right hidden sm:block">
            <p class="text-xs font-bold text-white">System Admin</p>
            <p class="text-[10px] text-[#84CC16] font-bold uppercase tracking-wider">Online</p>
          </div>
          <div
            class="w-9 h-9 rounded-xl bg-[#EF4444] shadow-lg shadow-red-500/20 flex items-center justify-center text-white font-black text-xs">
            SA
          </div>
        </div>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto bg-slate-50">
      <div class="w-full mx-auto p-4 md:p-8">
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
