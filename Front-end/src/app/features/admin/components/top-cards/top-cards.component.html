<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
  <div *ngFor="let card of topcards"
    class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
    <div class="flex items-center gap-4">
      <div [class]=" card.bgcolor + ' w-14 h-14 rounded-2xl flex items-center justify-center text-white shadow-lg'"
        [ngClass]="{
             'bg-emerald-500 shadow-emerald-100': card.bgcolor === 'success',
             'bg-rose-500 shadow-rose-100': card.bgcolor === 'danger',
             'bg-amber-500 shadow-amber-100': card.bgcolor === 'warning',
             'bg-sky-500 shadow-sky-100': card.bgcolor === 'info'
           }">
        <i [class]="card.icon" class="text-2xl"></i>
      </div>
      <div>
        <p class="text-sm font-medium text-gray-500">{{ card.subtitle }}</p>
        <h3 class="text-2xl font-bold text-gray-900">
          {{ card.subtitle.includes('Sales') ? '$' + (card.title?.toFixed(2) ?? '0.00') : (card.title ?? 0) }}
        </h3>
      </div>
    </div>
  </div>
</div>
