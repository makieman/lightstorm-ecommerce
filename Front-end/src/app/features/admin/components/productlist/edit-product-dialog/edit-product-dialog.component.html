<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6" role="dialog" aria-modal="true">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" (click)="dialog.close()"></div>

  <!-- Modal -->
  <div class="relative w-full max-w-2xl bg-white rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-5 border-b border-gray-100 rounded-t-2xl">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-amber-50 flex items-center justify-center">
          <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-bold text-gray-800">Edit Product</h2>
          <p class="text-xs text-gray-400 mt-0.5 truncate max-w-xs">{{ product.title }}</p>
        </div>
      </div>
      <button type="button" (click)="dialog.close()" class="text-gray-400 hover:text-gray-600 hover:bg-gray-100 p-2 rounded-full transition-colors">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Scrollable Form -->
    <form [formGroup]="editForm" class="flex-1 overflow-y-auto p-6 space-y-5"
      style="scrollbar-width: thin; scrollbar-color: #c1c1c1 #f1f1f1;">

      <!-- Current image preview -->
      <div *ngIf="product.image" class="flex items-center gap-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
        <img [src]="product.image" alt="Current image" class="w-16 h-16 rounded-lg object-cover border border-gray-200 flex-shrink-0">
        <div>
          <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Current Image</p>
          <p class="text-xs text-gray-400 mt-0.5">Upload a new file below to replace it</p>
        </div>
      </div>

      <!-- Name -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">
          Product Name <span class="text-red-500">*</span>
        </label>
        <input formControlName="title" type="text" placeholder="e.g. Solar Max 3000"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 placeholder-gray-400 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none">
      </div>

      <!-- Category & Price -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">
            Category <span class="text-red-500">*</span>
          </label>
          <div class="relative">
            <select formControlName="poductCategory"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none appearance-none cursor-pointer">
              <option value="Solar Panel">Solar Panel</option>
              <option value="Battery">Battery</option>
              <option value="Inverter">Inverter</option>
              <option value="Charge Controller">Charge Controller</option>
              <option value="Solar Lighting">Solar Lighting</option>
              <option value="Mounting Systems">Mounting Systems</option>
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-gray-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </div>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">
            Price (KSH) <span class="text-red-500">*</span>
          </label>
          <input formControlName="price" type="number" placeholder="0.00"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 placeholder-gray-400 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none">
        </div>
      </div>

      <!-- Description -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">
          Description <span class="text-red-500">*</span>
        </label>
        <textarea formControlName="details" rows="4" placeholder="Enter product description..."
          class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 placeholder-gray-400 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none resize-none"></textarea>
      </div>

      <!-- Quantity -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">
          Quantity <span class="text-red-500">*</span>
        </label>
        <input formControlName="productQuantity" type="number" placeholder="0"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 placeholder-gray-400 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none">
      </div>

      <!-- Specs Divider -->
      <div class="relative py-1">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-100"></div></div>
        <div class="relative flex justify-center">
          <span class="px-3 bg-white text-xs font-medium text-gray-400 uppercase tracking-widest">Specifications (Optional)</span>
        </div>
      </div>

      <!-- Specs Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Wattage</label>
          <input formControlName="wattage" type="text" placeholder="e.g. 450W"
            class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 placeholder-gray-400 text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Voltage</label>
          <input formControlName="voltage" type="text" placeholder="e.g. 12V"
            class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 placeholder-gray-400 text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Battery Type</label>
          <input formControlName="batteryType" type="text" placeholder="e.g. Lithium Ion"
            class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 placeholder-gray-400 text-sm focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none">
        </div>
      </div>

      <!-- Image Upload -->
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Replace Image</label>
        <input type="file" accept="image/*" (change)="onFileSelected($event)"
          class="w-full px-4 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-gray-800 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition-all">
        <div *ngIf="imageFile" class="mt-2 flex items-center gap-1.5 text-xs text-green-600">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
          {{ imageFile.name }}
        </div>
      </div>

    </form>

    <!-- Footer -->
    <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 rounded-b-2xl flex justify-end gap-3">
      <button type="button" (click)="dialog.close()"
        class="px-5 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:text-gray-800 hover:bg-gray-200 transition-colors">
        Cancel
      </button>
      <button type="button" (click)="editFormSubmit()"
        class="px-5 py-2.5 rounded-lg text-sm font-medium text-white bg-amber-500 hover:bg-amber-600 active:bg-amber-700 shadow-lg shadow-amber-200 transition-all flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
        Save Changes
      </button>
    </div>

  </div>
</div>
