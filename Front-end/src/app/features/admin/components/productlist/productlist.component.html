<div class="products-container animate-fade-in">
  <div class="flex justify-between items-center mb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-800">Products Inventory</h1>
      <p class="text-gray-500">Manage your catalog, prices, and stock levels.</p>
    </div>
    <button
      class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-semibold flex items-center gap-2 transition-all shadow-lg shadow-indigo-100"
      (click)="createProduct()">
      <i class="bi bi-plus-lg"></i>
      Create New Product
    </button>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-100">
            <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-widest">Product</th>
            <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-widest">Price</th>
            <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-widest text-center">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-50">
          <tr *ngFor="let product of products" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4">
              <div class="flex items-center gap-4">
                <img [src]="product.image" alt="product"
                  class="w-14 h-14 rounded-xl object-cover border border-gray-100 shadow-sm" />
                <div>
                  <h4 class="font-bold text-gray-900">{{ product.title }}</h4>
                  <p class="text-sm text-gray-500 max-w-xs truncate">{{ product.details }}</p>
                </div>
              </div>
            </td>
            <td class="px-6 py-4">
              <span
                class="inline-flex items-center px-3 py-1 rounded-full text-sm font-bold bg-green-50 text-green-700">
                ${{ product.price }}
              </span>
            </td>
            <td class="px-6 py-4">
              <div class="flex items-center justify-center gap-2">
                <button class="text-indigo-600 font-bold hover:underline px-2 py-1"
                  (click)="editProduct(product._id)">Edit</button>
                <button class="text-red-600 font-bold hover:underline px-2 py-1"
                  (click)="deleteProduct(product._id)">Delete</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="!products || products.length === 0" class="p-12 text-center">
      <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="bi bi-box-seam text-2xl text-gray-300"></i>
      </div>
      <h3 class="text-lg font-medium text-gray-900">No products found</h3>
      <p class="text-gray-500">Add your first product to see it here.</p>
    </div>
  </div>
</div>

<style>
  .animate-fade-in {
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
