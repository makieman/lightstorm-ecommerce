<div class="view-user-modal p-8 max-w-md mx-auto text-center">
  <div class="relative inline-block mb-6">
    <img [src]="user.image" class="w-24 h-24 rounded-full object-cover border-4 border-indigo-50 shadow-sm mx-auto"
      alt="User Avatar" />
    <div class="absolute bottom-1 right-1 w-5 h-5 bg-green-500 border-2 border-white rounded-full"></div>
  </div>

  <h3 class="text-2xl font-bold text-gray-800 mb-1">{{ data.userFromParent.username }}</h3>
  <p class="text-indigo-600 font-medium mb-8">System User</p>

  <div class="space-y-4 text-left bg-gray-50 p-6 rounded-2xl border border-gray-100">
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Email</span>
      <span class="text-sm font-semibold text-gray-800">{{ user.email }}</span>
    </div>
    <div class="h-px bg-gray-200 w-full"></div>
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Gender</span>
      <span class="text-sm font-semibold text-gray-800 capitalize">{{ user.gender }}</span>
    </div>
  </div>

  <div class="mt-8 flex justify-center">
    <button mat-dialog-close
      class="px-8 py-2.5 bg-gray-900 text-white rounded-xl font-bold hover:bg-gray-800 transition-all shadow-lg shadow-gray-200">
      Close Profile
    </button>
  </div>
</div>
