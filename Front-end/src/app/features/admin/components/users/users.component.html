<div class="users-container animate-fade-in">
  <div class="flex justify-between items-center mb-8">
    <div>
      <h1 class="text-3xl font-bold text-gray-800">Users Management</h1>
      <p class="text-gray-500">Manage your system users and their permissions.</p>
    </div>
    <button
      class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-semibold flex items-center gap-2 transition-all shadow-lg shadow-indigo-100"
      (click)="createUser()">
      <i class="bi bi-person-plus-fill"></i>
      Create New User
    </button>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse hidden md:table">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-100">
            <th class="px-6 py-4 text-sm font-semibold text-gray-600 uppercase tracking-wider">User Details</th>
            <th class="px-6 py-4 text-sm font-semibold text-gray-600 uppercase tracking-wider text-center">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-50">
          <tr *ngFor="let user of users" class="hover:bg-gray-50 transition-colors">
            <td class="px-6 py-4">
              <div class="flex items-center gap-4">
                <div class="relative">
                  <img [src]="user.image" alt="user"
                    class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm" />
                  <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
                </div>
                <div>
                  <h4 class="font-semibold text-gray-900">{{ user.username }}</h4>
                  <p class="text-sm text-gray-500">{{ user.email }}</p>
                </div>
              </div>
            </td>
            <td class="px-6 py-4">
              <div class="flex items-center justify-center gap-2">
                <button class="icon-action-btn text-blue-600 bg-blue-50" (click)="viewUser(user._id)"
                  title="View Details">
                  <i class="bi bi-eye-fill"></i>
                </button>
                <button class="icon-action-btn text-indigo-600 bg-indigo-50" (click)="editUser(user._id)"
                  title="Edit User">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button class="icon-action-btn text-red-600 bg-red-50" (click)="deleteUser(user._id)"
                  title="Delete User">
                  <i class="bi bi-trash3-fill"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Mobile Stacked Layout (Card Style) -->
      <div class="md:hidden flex flex-col divide-y divide-gray-100">
        <div *ngFor="let user of users" class="p-4 hover:bg-gray-50 transition-colors">
          <div class="flex items-center gap-4 mb-4">
            <div class="relative">
              <img [src]="user.image" alt="user"
                class="w-12 h-12 rounded-full object-cover border-2 border-white shadow-sm" />
              <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
            </div>
            <div class="min-w-0 flex-1">
              <h4 class="font-semibold text-gray-900 truncate">{{ user.username }}</h4>
              <p class="text-xs text-gray-500 truncate">{{ user.email }}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 justify-end">
            <button class="icon-action-btn flex-1 max-w-[80px] text-blue-600 bg-blue-50" (click)="viewUser(user._id)"
              title="View Details">
              <i class="bi bi-eye-fill"></i>
            </button>
            <button class="icon-action-btn flex-1 max-w-[80px] text-indigo-600 bg-indigo-50"
              (click)="editUser(user._id)" title="Edit User">
              <i class="bi bi-pencil-square"></i>
            </button>
            <button class="icon-action-btn flex-1 max-w-[80px] text-red-600 bg-red-50" (click)="deleteUser(user._id)"
              title="Delete User">
              <i class="bi bi-trash3-fill"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="!users || users.length === 0" class="p-12 text-center">
      <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="bi bi-people text-2xl text-gray-300"></i>
      </div>
      <h3 class="text-lg font-medium text-gray-900">No users found</h3>
      <p class="text-gray-500">Get started by creating your first user.</p>
    </div>
  </div>
</div>

<style>
  .animate-fade-in {
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .icon-action-btn {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
  }

  .icon-action-btn:hover {
    transform: translateY(-2px);
    filter: brightness(0.95);
  }
</style>
