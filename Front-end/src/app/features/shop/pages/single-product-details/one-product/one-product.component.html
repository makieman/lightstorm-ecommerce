<article
  class="related-product-card group h-full overflow-hidden rounded-[28px] border border-slate-100 bg-white shadow-[0_18px_45px_rgba(15,23,42,0.06)] transition-all duration-300 hover:-translate-y-1 hover:shadow-[0_22px_55px_rgba(15,23,42,0.12)]">
  <a [routerLink]="['/product', product._id]" class="block">
    <div class="relative h-56 overflow-hidden bg-slate-50">
      <img [src]="product.image" [alt]="product.title" class="product-image" loading="lazy" decoding="async" width="320"
        height="320" (error)="onImageError($event)">
      <div
        class="absolute left-4 top-4 rounded-full bg-white/90 px-3 py-1 text-[10px] font-black uppercase tracking-[0.18em] text-[var(--brand-navy)] shadow-sm">
        {{ product.category }}
      </div>
    </div>
  </a>

  <div class="flex h-[calc(100%-14rem)] flex-col p-5">
    <div class="flex items-start justify-between gap-3">
      <a [routerLink]="['/product', product._id]" class="product-title-anchor text-lg font-black leading-6">
        {{ product.title }}
      </a>
      <button mat-button type="button" class="cart-icon" (click)="openDialog()" aria-label="Quick preview">
        <mat-icon>search</mat-icon>
      </button>
    </div>

    <div class="mt-4 flex items-center justify-between gap-3 border-t border-slate-100 pt-4">
      <div>
        <p class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Retail Price</p>
        <p class="mt-2 text-xl font-black text-[var(--brand-coral)]">KSH {{ product.price | number }}</p>
      </div>
      <a [routerLink]="['/product', product._id]"
        class="inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-[var(--brand-navy)] text-white transition hover:bg-[var(--brand-coral)]">
        <mat-icon>arrow_forward</mat-icon>
      </a>
    </div>
  </div>
</article>
