<div class="space-y-12 pb-20">
  <!-- Hero Section (Banner) -->
  <section class="animate-fade-in px-4 md:px-0">
    <app-banner></app-banner>
  </section>

  <!-- Solutions Grid -->
  <section class="max-w-7xl mx-auto px-4 md:px-12">
    <div class="flex items-center justify-between mb-8">
      <h2 class="text-xl font-black text-[#1E293B] uppercase tracking-widest">Our Solutions</h2>
      <button [routerLink]="['/products']"
        class="text-xs font-bold text-[#84CC16] hover:underline uppercase tracking-wider cursor-pointer">
        Explore All
      </button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
      <div *ngFor="let solution of solutions" (click)="onSolutionClick(solution)"
        class="group flex flex-col items-center gap-3 cursor-pointer solution-card"
        [attr.data-category]="solution.slug">

        <!-- Icon Container with Enhanced Hover States -->
        <div
          class="w-20 h-20 bg-white shadow-xl shadow-slate-200/50 rounded-3xl flex items-center justify-center transition-all duration-300 transform group-hover:scale-110 group-hover:shadow-2xl"
          [style.color]="solution.color" [class]="solution.hoverColor" [style.--hover-bg]="solution.color">
          <i class="bi {{ solution.icon }} text-3xl transition-transform duration-300 group-hover:rotate-12"></i>
        </div>

        <!-- Category Name with Hover Effect -->
        <span
          class="text-xs font-black text-[#1E293B] uppercase tracking-tighter transition-all duration-300 group-hover:text-[#84CC16]">
          {{ solution.name }}
        </span>

        <!-- Click Indicator -->
        <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-300">
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1">
            <i class="bi bi-arrow-right-short"></i>
            View Products
          </span>
        </div>
      </div>
    </div>
  </section>

  <!-- Featured Products -->
  <section class="max-w-7xl mx-auto px-4 md:px-12">
    <div class="flex items-center justify-between mb-8">
      <h2 class="text-xl font-black text-[#1E293B] uppercase tracking-widest">Premium Inventory</h2>
      <div class="flex gap-2">
        <button
          class="w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center text-slate-400 hover:bg-[#1E293B] hover:text-white transition-all">
          <i class="bi bi-chevron-left"></i>
        </button>
        <button
          class="w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center text-slate-400 hover:bg-[#1E293B] hover:text-white transition-all">
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>
    </div>
    <app-product></app-product>
  </section>

  <!-- WhatsApp CTA -->
  <section class="max-w-7xl mx-auto px-4 md:px-12">
    <div class="bg-[#1E293B] rounded-[40px] p-8 md:p-12 relative overflow-hidden group">
      <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-8">
        <div class="text-center md:text-left">
          <h2 class="text-3xl md:text-4xl font-black text-white mb-4 leading-tight">Switch to Solar <br /> Today & Save.
          </h2>
          <p class="text-slate-400 font-bold uppercase tracking-[0.2em] text-xs">Professional Installation • Free Quote
            • Reliable Support</p>
        </div>
        <a href="https://wa.me/254718762530"
          class="flex items-center gap-4 bg-[#84CC16] text-white px-8 py-5 rounded-full font-black uppercase tracking-widest hover:scale-105 transition-all shadow-xl shadow-green-500/20">
          <i class="bi bi-whatsapp text-2xl"></i>
          Talk to an Expert
        </a>
      </div>
      <!-- Decorative circle -->
      <div
        class="absolute -right-20 -top-20 w-80 h-80 bg-[#EF4444] rounded-full opacity-10 group-hover:scale-110 transition-transform duration-700">
      </div>
    </div>
  </section>
</div>
