<div class="product-gallery space-y-16">
  <div *ngFor="let category of categories" class="category-segment">
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <div class="w-1.5 h-6 bg-[#EF4444] rounded-full"></div>
        <h3 class="text-lg font-black text-[#1E293B] uppercase tracking-wider">{{category}}</h3>
      </div>
      <a [routerLink]="['/products']" [queryParams]="{category: category}"
        class="text-xs font-black text-slate-400 hover:text-[#EF4444] transition-colors uppercase tracking-widest">See
        Collection →</a>
    </div>

    <!-- Mobile Horizontal Scroll / Desktop Grid -->
    <div class="flex overflow-x-auto no-scrollbar pb-6 gap-6 md:grid md:grid-cols-3 lg:grid-cols-4 md:overflow-visible">
      <div *ngFor="let product of productsByCategory[category]"
        class="min-w-[260px] md:min-w-0 bg-white rounded-[32px] overflow-hidden shadow-xl shadow-slate-200/40 border border-slate-50 group hover:-translate-y-2 transition-all duration-500">

        <div class="relative h-64 bg-slate-50 overflow-hidden">
          <img [src]="product.image" [alt]="product.title"
            class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">

          <!-- Badges -->
          <div class="absolute top-4 left-4 flex flex-col gap-2">
            <span
              class="bg-[#84CC16] text-white text-[10px] font-black px-3 py-1.5 rounded-full shadow-lg shadow-green-500/20 uppercase tracking-widest">Premium</span>
          </div>

          <!-- Quick Actions Overlay -->
          <div
            class="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center gap-3">
            <button (click)="openDialog(product._id)"
              class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-[#1E293B] hover:text-[#EF4444] transition-colors">
              <i class="bi bi-eye-fill"></i>
            </button>
            <button (click)="addToCart(product, $event)"
              class="w-12 h-12 bg-[#EF4444] rounded-2xl flex items-center justify-center text-white hover:bg-rose-600 transition-colors shadow-lg shadow-red-500/30">
              <i class="bi bi-cart-plus-fill"></i>
            </button>
          </div>
        </div>

        <div class="p-6">
          <div class="flex justify-between items-start mb-2">
            <div>
              <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">{{product.category}}</p>
              <h4 class="font-black text-[#1E293B] leading-tight truncate w-full">
                <a [routerLink]="['/product', product._id]" class="hover:text-[#EF4444] transition-colors">
                  {{product.title}}
                </a>
              </h4>
            </div>
          </div>

          <div class="flex items-center gap-1 mb-4">
            <i class="bi bi-star-fill text-[#84CC16] text-xs"></i>
            <i class="bi bi-star-fill text-[#84CC16] text-xs"></i>
            <i class="bi bi-star-fill text-[#84CC16] text-xs"></i>
            <i class="bi bi-star-fill text-[#84CC16] text-xs"></i>
            <i class="bi bi-star-half text-[#84CC16] text-xs"></i>
            <span class="text-[10px] text-slate-400 font-bold ml-1">(24 Reviews)</span>
          </div>

          <div class="flex items-center justify-between pt-4 border-t border-slate-50">
            <div class="flex flex-col">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Retail Price</span>
              <span class="text-xl font-black text-[#EF4444]">KSh {{product.price | number}}</span>
            </div>
            <button (click)="addToCart(product, $event)"
              class="w-10 h-10 bg-[#1E293B] text-white rounded-xl flex items-center justify-center hover:bg-[#EF4444] transition-all">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
