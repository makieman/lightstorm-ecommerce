<div class="product-gallery space-y-12">
  <ng-container *ngIf="isLoading; else productGallery">
    <div *ngFor="let category of skeletonCategories" class="space-y-5">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <div class="h-3 w-28 animate-pulse rounded bg-slate-200"></div>
          <div class="mt-3 h-8 w-52 animate-pulse rounded bg-slate-200"></div>
        </div>
        <div class="h-5 w-32 animate-pulse rounded bg-slate-200"></div>
      </div>

      <div class="grid grid-cols-2 gap-3 pb-6 md:grid-cols-3 md:gap-6 lg:grid-cols-4 w-full">
        <div *ngFor="let card of skeletonCards" class="overflow-hidden rounded-xl md:rounded-[20px] border border-slate-100 bg-white shadow-xl shadow-slate-200/30">
          <div class="h-24 sm:h-32 md:h-40 animate-pulse bg-slate-200"></div>
          <div class="space-y-3 p-3 md:p-6">
            <div class="h-4 w-20 animate-pulse rounded bg-slate-200"></div>
            <div class="h-5 w-3/4 animate-pulse rounded bg-slate-200"></div>
            <div class="h-4 w-1/2 animate-pulse rounded bg-slate-200"></div>
            <div class="h-10 w-full animate-pulse rounded bg-slate-200"></div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-template #productGallery>
  <div *ngFor="let category of categories" class="category-segment space-y-5">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-[10px] font-black uppercase tracking-[0.24em] text-slate-400">Category Spotlight</p>
        <h3 class="mt-2 text-2xl font-black text-[#1E293B]">{{ category }}</h3>
      </div>
      <a [routerLink]="['/products']" [queryParams]="{ category: category }"
        class="inline-flex items-center gap-2 text-xs font-bold uppercase tracking-[0.18em] text-[#84CC16] hover:text-[#1E293B]">
        Shop Collection
        <i class="bi bi-arrow-right"></i>
      </a>
    </div>


    <!-- Mobile 2-Column Grid / Desktop Grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6 pb-6 w-full">
      <article *ngFor="let product of productsByCategory[category]"
        class="product-card"
        (click)="navigateToProduct(product._id)">

        <div class="product-card-media">
          <img
            [src]="product.image"
            [alt]="product.title"
            loading="lazy"
            decoding="async"
            width="480"
            height="320"
            (error)="onImageError($event)"
          />
          <div class="product-card-actions">
            <button
              class="product-action-button"
              type="button"
              (click)="navigateToProduct(product._id); $event.stopPropagation()"
              aria-label="View details">
              <i class="bi bi-eye"></i>
            </button>
            <button
              class="product-action-button"
              type="button"
              (click)="addToCart(product, $event); $event.stopPropagation()"
              aria-label="Add to cart">
              <i class="bi bi-cart-plus"></i>
            </button>
          </div>
        </div>

        <div class="product-card-body">
          <h3 class="product-title">
            <a [routerLink]="['/product', product._id]"
               (click)="$event.stopPropagation()">
              {{ product.title }}
            </a>
          </h3>
          <p class="product-price">From KES {{ product.price | number }}</p>
        </div>

      </article>
    </div>
  </div>
  </ng-template>
</div>
